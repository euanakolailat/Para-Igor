```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pelo Mundo — Para Igor</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --paper: #f5f1e9;
      --ink: #292724;
      --muted: #77716a;
      --line: #c9c1b6;
    }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    /* =========================
       PÁGINA
    ========================= */

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 55px 28px 80px;
    }

    .header {
      text-align: center;
      margin-bottom: 55px;
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(48px, 9vw, 82px);
      font-weight: normal;
      line-height: .95;
      margin-bottom: 25px;
    }

    .intro {
      max-width: 560px;
      margin: 0 auto;
      color: #5e5953;
      font-size: 18px;
      line-height: 1.7;
    }

    /* =========================
       GALERIA
    ========================= */

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
      max-width: 900px;
      margin: 0 auto;
    }

    .memory {
      border: none;
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
    }

    .photo {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #e5e0d7;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform .25s, box-shadow .25s;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .photo-placeholder {
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .memory:hover .photo {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(40,35,30,.12);
    }

    .memory-info {
      padding: 14px 4px 0;
    }

    .memory-place {
      font-size: 20px;
    }

    .memory-description {
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 5px;
    }

    /* =========================
       MODAL / MEMÓRIA
    ========================= */

    .memory-overlay {
      position: fixed;
      inset: 0;
      background: rgba(41,39,36,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
    }

    .memory-overlay.active {
      display: flex;
    }

    .memory-card {
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      background: #faf7f0;
      border: 1px solid var(--line);
      padding: clamp(30px, 6vw, 60px);
      box-shadow: 0 25px 70px rgba(0,0,0,.18);
      position: relative;
    }

    .memory-card-number {
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .memory-card h2 {
      font-size: clamp(34px, 6vw, 52px);
      font-weight: normal;
      line-height: 1;
      margin-bottom: 30px;
    }

    .memory-card-text {
      font-size: 18px;
      line-height: 1.8;
      color: #4d4842;
      white-space: pre-line;
    }

    .close-button {
      margin-top: 35px;
      border: none;
      border-bottom: 1px solid var(--ink);
      background: transparent;
      padding: 8px 0;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* =========================
       CONTINUAR
    ========================= */

    .next-container {
      text-align: center;
      margin-top: 65px;
    }

    .next-button {
      display: inline-block;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      padding: 14px 30px;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: .25s;
    }

    .next-button:hover {
      background: var(--ink);
      color: var(--paper);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      .page {
        padding: 40px 18px 60px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .intro {
        font-size: 17px;
      }

      .memory-card {
        padding: 30px 24px;
      }

      .memory-card-text {
        font-size: 17px;
      }

    }

  </style>
</head>

<body>

  <main class="page">

    <!-- =========================
         CABEÇALHO
    ========================= -->

    <header class="header">

      <div class="eyebrow">
        PARTE 03
      </div>

      <h1>
        Pelo Mundo
      </h1>

      <p class="intro">
        Conhecer lugares ao seu lado
        é certamente das minhas melhores memórias!
      </p>

    </header>


    <!-- =========================
         FOTOS
    ========================= -->

    <section class="gallery">


      <!-- FOTO 01 -->

      <button
        class="memory"
        type="button"
        onclick="openMemory(0)"
      >

        <div class="photo">

          <!--
            QUANDO TIVER A FOTO,
            COLOQUE O CAMINHO AQUI:

            <img src="imagens/nome-da-foto.jpg" alt="Porto">
          -->

          <span class="photo-placeholder">
            FOTO 01
          </span>

        </div>

        <div class="memory-info">

          <div class="memory-place">
            Porto
          </div>

          <div class="memory-description">
            onde começou
          </div>

        </div>

      </button>


      <!-- FOTO 02 -->

      <button
        class="memory"
        type="button"
        onclick="openMemory(1)"
      >

        <div class="photo">

          <span class="photo-placeholder">
            FOTO 02
          </span>

        </div>

        <div class="memory-info">

          <div class="memory-place">
            Argentina
          </div>

          <div class="memory-description">
            pelo caminho
          </div>

        </div>

      </button>


      <!-- FOTO 03 -->

      <button
        class="memory"
        type="button"
        onclick="openMemory(2)"
      >

        <div class="photo">

          <span class="photo-placeholder">
            FOTO 03
          </span>

        </div>

        <div class="memory-info">

          <div class="memory-place">
            Peru
          </div>

          <div class="memory-description">
            uma aventura
          </div>

        </div>

      </button>


      <!-- FOTO 04 -->

      <button
        class="memory"
        type="button"
        onclick="openMemory(3)"
      >

        <div class="photo">

          <span class="photo-placeholder">
            FOTO 04
          </span>

        </div>

        <div class="memory-info">

          <div class="memory-place">
            Colômbia
          </div>

          <div class="memory-description">
            outro pedaço do mundo
          </div>

        </div>

      </button>


      <!-- FOTO 05 -->

      <button
        class="memory"
        type="button"
        onclick="openMemory(4)"
      >

        <div class="photo">

          <span class="photo-placeholder">
            FOTO 05
          </span>

        </div>

        <div class="memory-info">

          <div class="memory-place">
            Um lugar qualquer
          </div>

          <div class="memory-description">
            uma memória
          </div>

        </div>

      </button>


      <!-- FOTO 06 -->

      <button
        class="memory"
        type="button"
        onclick="openMemory(5)"
      >

        <div class="photo">

          <span class="photo-placeholder">
            FOTO 06
          </span>

        </div>

        <div class="memory-info">

          <div class="memory-place">
            Nós dois
          </div>

          <div class="memory-description">
            mais importante que o lugar
          </div>

        </div>

      </button>

    </section>


    <!-- =========================
         CONTINUAR
    ========================= -->

    <div class="next-container">

      <a
        href="parte4.html"
        class="next-button"
      >
        Continuar →
      </a>

    </div>

  </main>


  <!-- =========================
       JANELA DAS MEMÓRIAS
  ========================= -->

  <div
    id="memory-overlay"
    class="memory-overlay"
  >

    <article class="memory-card">

      <div
        id="memory-number"
        class="memory-card-number"
      ></div>

      <h2 id="memory-title"></h2>

      <div
        id="memory-text"
        class="memory-card-text"
      ></div>

      <button
        class="close-button"
        type="button"
        onclick="closeMemory()"
      >
        Fechar
      </button>

    </article>

  </div>


  <script>

    /*
      ==========================================
      MEMÓRIAS
      ==========================================

      É AQUI que vamos escrever as mensagens
      de cada lugar.

      Você pode escrever quantos parágrafos quiser.
    */

    const memories = [

      {
        number: "MEMÓRIA 01",
        title: "Porto",
        text: `COLOQUE AQUI A MEMÓRIA DO PORTO.

Pode ser uma história específica daquele lugar,
uma coisa que aconteceu,
ou simplesmente o que aquele lugar representa
para você.`
      },

      {
        number: "MEMÓRIA 02",
        title: "Argentina",
        text: `COLOQUE AQUI A MEMÓRIA DA ARGENTINA.

Pode falar sobre uma viagem,
uma situação engraçada,
um momento difícil,
ou alguma coisa que você lembra
quando pensa naquele lugar.`
      },

      {
        number: "MEMÓRIA 03",
        title: "Peru",
        text: `COLOQUE AQUI A MEMÓRIA DO PERU.`
      },

      {
        number: "MEMÓRIA 04",
        title: "Colômbia",
        text: `COLOQUE AQUI A MEMÓRIA DA COLÔMBIA.`
      },

      {
        number: "MEMÓRIA 05",
        title: "Um lugar qualquer",
        text: `COLOQUE AQUI UMA OUTRA MEMÓRIA.`
      },

      {
        number: "MEMÓRIA 06",
        title: "Nós dois",
        text: `COLOQUE AQUI A MEMÓRIA FINAL.

Talvez aqui possamos fazer a transição
para a ideia de HOME.

Não importa exatamente onde estávamos.
Importava que estávamos juntos.`
      }

    ];


    /*
      ==========================================
      ABRIR MEMÓRIA
      ==========================================
    */

    function openMemory(index) {

      const memory = memories[index];

      if (!memory) return;

      document.getElementById("memory-number").textContent =
        memory.number;

      document.getElementById("memory-title").textContent =
        memory.title;

      document.getElementById("memory-text").textContent =
        memory.text;

      document
        .getElementById("memory-overlay")
        .classList.add("active");

    }


    /*
      ==========================================
      FECHAR MEMÓRIA
      ==========================================
    */

    function closeMemory() {

      document
        .getElementById("memory-overlay")
        .classList.remove("active");

    }


    /*
      CLICAR FORA DA CARTA FECHA
    */

    document
      .getElementById("memory-overlay")
      .addEventListener("click", function(event) {

        if (event.target === this) {
          closeMemory();
        }

      });


    /*
      ESC FECHA
    */

    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {
        closeMemory();
      }

    });

  </script>

</body>
</html>
