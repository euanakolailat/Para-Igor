```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pelo mundo — Para Igor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --paper: #f5f1e9;
      --ink: #292724;
      --muted: #77716a;
      --line: #c9c1b6;
    }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    /* =========================
       PÁGINA
    ========================= */

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 28px 80px;
    }

    .header {
      text-align: center;
      margin-bottom: 55px;
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(48px, 9vw, 82px);
      font-weight: normal;
      line-height: .95;
      margin-bottom: 22px;
    }

    .intro {
      max-width: 560px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    /* =========================
       GALERIA
    ========================= */

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .place {
      position: relative;
      border: none;
      padding: 0;
      background: none;
      cursor: pointer;
      overflow: hidden;
      text-align: left;
    }

    .place-image {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #ded9d0;
    }

    .place-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .6s ease;
    }

    .place:hover img {
      transform: scale(1.04);
    }

    .place-info {
      padding: 15px 4px 5px;
    }

    .place-number {
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }

    .place-name {
      font-size: 24px;
      font-weight: normal;
    }

    .place-hint {
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
      display: block;
    }

    /* =========================
       CARTA / MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(41,39,36,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 25px;
      z-index: 20;
    }

    .modal.active {
      display: flex;
    }

    .letter {
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      background: #faf7f0;
      border: 1px solid var(--line);
      padding: clamp(30px, 7vw, 65px);
      box-shadow: 0 25px 80px rgba(0,0,0,.18);
      position: relative;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 22px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 20px;
      color: var(--muted);
    }

    .letter-number {
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 22px;
    }

    .letter h2 {
      font-size: clamp(38px, 7vw, 58px);
      font-weight: normal;
      margin-bottom: 28px;
    }

    .letter-content {
      font-size: 18px;
      line-height: 1.85;
      color: #4d4842;
      white-space: pre-line;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      .page {
        padding: 40px 18px 60px;
      }

      .header {
        margin-bottom: 40px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .place-name {
        font-size: 22px;
      }

      .modal {
        padding: 15px;
      }

      .letter {
        padding: 45px 25px 35px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- =========================
         CABEÇALHO
    ========================= -->

    <header class="header">

      <div class="eyebrow">
        terceira parada
      </div>

      <h1>Pelo mundo</h1>

      <p class="intro">
        Talvez viajar nunca tenha sido sobre os lugares.
        Talvez tenha sido sobre tudo aquilo que aconteceu
        enquanto estávamos neles.
      </p>

    </header>


    <!-- =========================
         GALERIA
    ========================= -->

    <section class="gallery">


      <!-- PARANÁ -->

      <button class="place" type="button" onclick="openPlace('parana')">

        <div class="place-image">
          <img src="imagens/parana.jpg" alt="Paraná">
        </div>

        <div class="place-info">

          <span class="place-number">01</span>

          <div class="place-name">
            Paraná
          </div>

          <span class="place-hint">
            clique para lembrar
          </span>

        </div>

      </button>


      <!-- RIO -->

      <button class="place" type="button" onclick="openPlace('rio')">

        <div class="place-image">
          <img src="imagens/rio.jpg" alt="Rio de Janeiro">
        </div>

        <div class="place-info">

          <span class="place-number">02</span>

          <div class="place-name">
            Rio de Janeiro
          </div>

          <span class="place-hint">
            clique para lembrar
          </span>

        </div>

      </button>


      <!-- PATAGÔNIA -->

      <button class="place" type="button" onclick="openPlace('patagonia')">

        <div class="place-image">
          <img src="imagens/patagonia.jpg" alt="Patagônia">
        </div>

        <div class="place-info">

          <span class="place-number">03</span>

          <div class="place-name">
            Patagônia
          </div>

          <span class="place-hint">
            clique para lembrar
          </span>

        </div>

      </button>


      <!-- COLÔMBIA -->

      <button class="place" type="button" onclick="openPlace('colombia')">

        <div class="place-image">
          <img src="imagens/colombia.jpg" alt="Colômbia">
        </div>

        <div class="place-info">

          <span class="place-number">04</span>

          <div class="place-name">
            Colômbia
          </div>

          <span class="place-hint">
            clique para lembrar
          </span>

        </div>

      </button>


      <!-- PRAGA -->

      <button class="place" type="button" onclick="openPlace('praga')">

        <div class="place-image">
          <img src="imagens/praga.jpg" alt="Praga">
        </div>

        <div class="place-info">

          <span class="place-number">05</span>

          <div class="place-name">
            Praga
          </div>

          <span class="place-hint">
            clique para lembrar
          </span>

        </div>

      </button>


      <!-- NÁPOLES -->

      <button class="place" type="button" onclick="openPlace('napoli')">

        <div class="place-image">
          <img src="imagens/napoli.jpg" alt="Nápoles">
        </div>

        <div class="place-info">

          <span class="place-number">06</span>

          <div class="place-name">
            Napoli
          </div>

          <span class="place-hint">
            clique para lembrar
          </span>

        </div>

      </button>


      <!-- CUSCO -->

      <button class="place" type="button" onclick="openPlace('cusco')">

        <div class="place-image">
          <img src="imagens/cusco.jpg" alt="Cusco">
        </div>

        <div class="place-info">

          <span class="place-number">07</span>

          <div class="place-name">
            Cusco
          </div>

          <span class="place-hint">
            clique para lembrar
          </span>

        </div>

      </button>


      <!-- NAZARÉ -->

      <button class="place" type="button" onclick="openPlace('nazare')">

        <div class="place-image">
          <img src="imagens/nazare.jpg" alt="Nazaré">
        </div>

        <div class="place-info">

          <span class="place-number">08</span>

          <div class="place-name">
            Nazaré
          </div>

          <span class="place-hint">
            clique para lembrar
          </span>

        </div>

      </button>


    </section>

  </main>


  <!-- =========================
       MODAL
  ========================= -->

  <div id="modal" class="modal">

    <article class="letter">

      <button class="close" type="button" onclick="closeModal()">
        ×
      </button>

      <div id="letter-number" class="letter-number"></div>

      <h2 id="letter-title"></h2>

      <div id="letter-content" class="letter-content"></div>

    </article>

  </div>


  <script>

    /* =========================
       TEXTOS DAS VIAGENS
    ========================= */

    const places = {

      parana: {
        number: "01",
        title: "Paraná",
        text: `AQUI ENTRA O TEXTO SOBRE O PARANÁ.

Pode escrever aqui tudo aquilo que você lembra dessa viagem.

Uma memória.
Uma situação engraçada.
Alguma coisa que ele fez.
Alguma coisa que você sentiu.

Não precisa ser sobre o lugar.
É sobre vocês naquele lugar.`
      },

      rio: {
        number: "02",
        title: "Rio de Janeiro",
        text: `AQUI ENTRA O TEXTO SOBRE O RIO DE JANEIRO.

Uma lembrança que só vocês dois entendem.

Pode ser uma história pequena.
Às vezes são justamente essas que ficam.`
      },

      patagonia: {
        number: "03",
        title: "Patagônia",
        text: `AQUI ENTRA O TEXTO SOBRE A PATAGÔNIA.

Pode falar sobre alguma aventura,
alguma dificuldade ou algum momento
em que vocês perceberam que viajar juntos
era diferente de simplesmente viajar.`
      },

      colombia: {
        number: "04",
        title: "Colômbia",
        text: `AQUI ENTRA O TEXTO SOBRE A COLÔMBIA.

Uma lembrança dessa viagem.

Um lugar.
Uma conversa.
Uma situação completamente aleatória.

Qualquer coisa que faça ele lembrar de vocês.`
      },

      praga: {
        number: "05",
        title: "Praga",
        text: `AQUI ENTRA O TEXTO SOBRE PRAGA.

Talvez uma lembrança pequena
que ficou maior com o tempo.`
      },

      napoli: {
        number: "06",
        title: "Napoli",
        text: `AQUI ENTRA O TEXTO SOBRE NAPOLI.

Pode falar sobre a viagem,
sobre vocês,
ou simplesmente sobre uma memória
que você não quer esquecer.`
      },

      cusco: {
        number: "07",
        title: "Cusco",
        text: `AQUI ENTRA O TEXTO SOBRE CUSCO.

Uma lembrança dessa viagem.

Algo que você gostaria
que ele pudesse enxergar novamente
através dos seus olhos.`
      },

      nazare: {
        number: "08",
        title: "Nazaré",
        text: `AQUI ENTRA O TEXTO SOBRE NAZARÉ.

A última parada desta parte.

E talvez uma lembrança que mostre
que nunca foram os lugares.

Foram vocês.`
      }

    };


    /* =========================
       ELEMENTOS
    ========================= */

    const modal = document.getElementById("modal");
    const letterNumber = document.getElementById("letter-number");
    const letterTitle = document.getElementById("letter-title");
    const letterContent = document.getElementById("letter-content");


    /* =========================
       ABRIR CARTA
    ========================= */

    function openPlace(placeName) {

      const place = places[placeName];

      if (!place) return;

      letterNumber.textContent =
        "MEMÓRIA " + place.number;

      letterTitle.textContent =
        place.title;

      letterContent.textContent =
        place.text;

      modal.classList.add("active");

      document.body.style.overflow = "hidden";
    }


    /* =========================
       FECHAR CARTA
    ========================= */

    function closeModal() {

      modal.classList.remove("active");

      document.body.style.overflow = "";
    }


    /* =========================
       CLICAR FORA DA CARTA
    ========================= */

    modal.addEventListener("click", function(event) {

      if (event.target === modal) {
        closeModal();
      }

    });


    /* =========================
       ESC FECHA
    ========================= */

    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {
        closeModal();
      }

    });

  </script>

</body>
</html>
