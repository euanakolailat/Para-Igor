      text-transform: uppercase;
      color: var(--muted);

    ========================= */

      cursor: default;

    ========================= */

    .letter-overlay {

    /* =========================
       ELEMENTOS
    ========================= */

    const envelopesContainer =
      document.getElementById("envelopes");

    const counter =
      document.getElementById("counter");

    const overlay =
      document.getElementById("letter-overlay");

    const letterDay =
      document.getElementById("letter-day");

    const letterTitle =
      document.getElementById("letter-title");

    const letterText =
      document.getElementById("letter-text");

    const closeLetter =
      document.getElementById("close-letter");

    const continueButton =
      document.getElementById("continue-button");


    /* =========================
       DATA DE HOJE
    ========================= */

    function getToday() {

      const now = new Date();

      return new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

    }


    /* =========================
       DIAS LIBERADOS
    ========================= */

    function getUnlockedDays() {

      const today = getToday();

      const difference =
        today.getTime() -
        startDate.getTime();

      const daysPassed =
        Math.floor(
          difference /
          (1000 * 60 * 60 * 24)
        );

      return Math.min(
        Math.max(daysPassed + 1, 0),
        totalDays
      );

    }


    /* =========================
       FORMATAR DATA
    ========================= */

    function formatDate(date) {

      return date.toLocaleDateString(
        "pt-BR",
        {
          day: "2-digit",
          month: "2-digit"
        }
      );

    }


    /* =========================
       CRIAR ENVELOPES
    ========================= */

    function renderEnvelopes() {

      envelopesContainer.innerHTML = "";

      const unlockedDays =
        getUnlockedDays();


      /* CONTADOR */

      if (unlockedDays === 0) {

        counter.textContent =
          "Os envelopes começam a ser liberados em 29/08/2026.";

      } else {

        counter.textContent =
          unlockedDays +
          " de " +
          totalDays +
          " cartas liberadas";

      }


      /* ENVELOPES */

      for (
        let i = 0;
        i < totalDays;
        i++
      ) {

        const dayNumber = i + 1;

        const unlocked =
          dayNumber <= unlockedDays;


        const envelope =
          document.createElement("button");

        envelope.type = "button";

        envelope.className =
          "envelope" +
          (unlocked ? "" : " locked");


        const inner =
          document.createElement("div");

        inner.className =
          "envelope-inner";


        const number =
          document.createElement("div");

        number.className =
          "envelope-number";

        number.textContent =
          "Dia " +
          String(dayNumber).padStart(2, "0");


        const symbol =
          document.createElement("div");

        symbol.className =
          "envelope-symbol";

        symbol.textContent =
          unlocked ? "✉" : "🔒";


        const label =
          document.createElement("div");

        label.className =
          "envelope-label";

        label.textContent =
          unlocked
            ? "Abrir carta"
            : "Ainda não";


        inner.appendChild(number);
        inner.appendChild(symbol);
        inner.appendChild(label);


        /* DATA DE LIBERAÇÃO */

        if (!unlocked) {

          const releaseDate =
            new Date(startDate);

          releaseDate.setDate(
            startDate.getDate() + i
          );


          const date =
            document.createElement("div");

          date.className =
            "locked-date";

          date.textContent =
            "abre em " +
            formatDate(releaseDate);

          inner.appendChild(date);

        }


        envelope.appendChild(inner);

        envelopesContainer.appendChild(
          envelope
        );


        /* CLIQUE */

        if (unlocked) {

          envelope.addEventListener(
            "click",
            () => openLetter(i)
          );

        }

      }

    }


    /* =========================
       ABRIR CARTA
    ========================= */

    function openLetter(index) {

      const letter =
        letters[index];


      if (!letter) {
        return;
      }


      letterDay.textContent =
        "32 DIAS LONGE DE VOCÊ • " +
        String(index + 1).padStart(2, "0");


      letterTitle.textContent =
        letter.title;


      letterText.textContent =
        letter.text;


      overlay.classList.add("active");


      document.body.style.overflow =
        "hidden";

    }


    /* =========================
       FECHAR CARTA
    ========================= */

    function closeLetterWindow() {

      overlay.classList.remove(
        "active"
      );

      document.body.style.overflow =
        "";

    }


    closeLetter.addEventListener(
      "click",
      closeLetterWindow
    );


    overlay.addEventListener(
      "click",
      event => {

        if (
          event.target === overlay
        ) {

          closeLetterWindow();

        }

      }
    );


    /* =========================
       INICIAR
    ========================= */

    renderEnvelopes();


    /* =========================
       ATUALIZA À MEIA-NOITE
    ========================= */

    setInterval(
      renderEnvelopes,
      60000
    );

  </script>
