<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para Igor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --paper: #f5f1e9;
      --ink: #292724;
      --muted: #77716a;
      --line: #c9c1b6;
      --accent: #8b6f5a;
    }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    button {
      font: inherit;
    }

    .screen {
      min-height: 100vh;
      display: none;
      padding: 28px;
    }

    .screen.active {
      display: flex;
    }

    /* =========================
       ABERTURA
    ========================= */

    #opening {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .opening-inner {
      max-width: 680px;
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(58px, 14vw, 110px);
      font-weight: normal;
      line-height: .9;
      margin-bottom: 30px;
    }

    .opening-description {
      max-width: 500px;
      margin: 0 auto 45px;
      font-size: 19px;
      line-height: 1.7;
      color: #5e5953;
    }

    .main-button {
      border: 1px solid var(--ink);
      background: transparent;
      padding: 16px 34px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: .25s;
    }

    .main-button:hover {
      background: var(--ink);
      color: var(--paper);
    }

    /* =========================
       MAPA
    ========================= */

    #map-screen {
      flex-direction: column;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    .map-header {
      text-align: center;
      padding: 35px 10px 20px;
    }

    .map-header h2 {
      font-size: clamp(36px, 7vw, 64px);
      font-weight: normal;
      margin-bottom: 12px;
    }

    .map-header p {
      color: var(--muted);
      font-size: 16px;
    }

    .map {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 620px;
      margin: 20px auto 0;
      overflow: hidden;

      background:
        linear-gradient(
          25deg,
          transparent 48%,
          rgba(139,111,90,.12) 49%,
          transparent 50%
        ),
        linear-gradient(
          -15deg,
          transparent 48%,
          rgba(139,111,90,.09) 49%,
          transparent 50%
        ),
        #e9e4db;

      border: 1px solid var(--line);
    }

    /* Rio */

    .river {
      position: absolute;
      right: -5%;
      top: -10%;
      width: 35%;
      height: 125%;
      background: #d7d9d5;
      border-left: 1px solid #c2c4c0;
      transform: rotate(8deg);
    }

    /* Linhas decorativas */

    .road {
      position: absolute;
      height: 1px;
      background: rgba(70,65,60,.18);
      transform-origin: left center;
    }

    .road.one {
      width: 75%;
      top: 40%;
      left: 5%;
      transform: rotate(-12deg);
    }

    .road.two {
      width: 65%;
      top: 65%;
      left: 2%;
      transform: rotate(8deg);
    }

    .road.three {
      width: 70%;
      top: 25%;
      left: 10%;
      transform: rotate(18deg);
    }

    /* Pontos */

    .location {
      position: absolute;
      transform: translate(-50%, -50%);
      border: none;
      background: transparent;
      cursor: pointer;
      text-align: center;
      color: var(--ink);
      z-index: 5;
    }

    .location-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--ink);
      border: 4px solid var(--paper);
      box-shadow: 0 0 0 1px var(--ink);
      margin: 0 auto 10px;
      transition: transform .25s;
    }

    .location:hover .location-dot {
      transform: scale(1.3);
    }

    .location-name {
      display: block;
      white-space: nowrap;
      font-size: 14px;
      background: rgba(245,241,233,.9);
      padding: 5px 9px;
    }

    .location-subtitle {
      display: block;
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 3px;
    }

    /* Posições */

    .feup {
      left: 29%;
      top: 31%;
    }

    .ribeira {
      left: 66%;
      top: 67%;
    }

    .aguda {
      left: 17%;
      top: 82%;
    }

    /* =========================
       CARTA
    ========================= */

    #letter-screen {
      align-items: center;
      justify-content: center;
    }

    .letter {
      width: 100%;
      max-width: 720px;
      background: #faf7f0;
      border: 1px solid var(--line);
      padding: clamp(30px, 7vw, 70px);
      box-shadow: 0 20px 60px rgba(40,35,30,.08);
    }

    .letter-number {
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 25px;
    }

    .letter h2 {
      font-size: clamp(36px, 7vw, 58px);
      font-weight: normal;
      margin-bottom: 30px;
    }

    .letter-content {
      font-size: 18px;
      line-height: 1.8;
      color: #4d4842;
      white-space: pre-line;
    }

    .letter-photo {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      margin: 30px 0;
      display: none;
    }

    .back-button {
      margin-top: 40px;
      border: none;
      border-bottom: 1px solid var(--ink);
      background: transparent;
      padding: 8px 0;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

     .next-container {
      text-align: center;
      margin-top: 35px;
      padding-bottom: 30px;
    }

    .next-button {
      display: inline-block;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      padding: 14px 30px;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: .25s;
    }

    .next-button:hover {
      background: var(--ink);
      color: var(--paper);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      .screen {
        padding: 18px;
      }

      .map {
        height: 70vh;
        min-height: 480px;
      }

      .location-name {
        font-size: 12px;
      }

      .location-subtitle {
        font-size: 8px;
      }

      .letter {
        padding: 30px 24px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       ABERTURA
  ========================= -->

  <section id="opening" class="screen active">

    <div class="opening-inner">

      <div class="eyebrow">
        um presente com amor
      </div>

      <h1>Para Igor</h1>

      <p class="opening-description">
        Eu queria conseguir te entregar isso pessoalmente. 
        Como ainda não posso, encontrei outra maneira de chegar até você.
      </p>

      <button
        id="start-button"
        class="main-button"
        type="button"
      >
        Começar
      </button>

    </div>

  </section>


  <!-- =========================
       MAPA
  ========================= -->

  <section id="map-screen" class="screen">

    <div class="map-header">

      <div class="eyebrow">
        primeira parada
      </div>

      <h2>Porto</h2>

      <p>
        Escolha um ponto para continuar.
      </p>

    </div>

    <div class="map">

      <div class="river"></div>

      <div class="road one"></div>
      <div class="road two"></div>
      <div class="road three"></div>


      <!-- FEUP -->

      <button
        class="location feup"
        type="button"
        data-location="feup"
      >

        <div class="location-dot"></div>

        <span class="location-name">
          Faculdade de Engenharia
        </span>

        <span class="location-subtitle">
          onde tudo começou
        </span>

      </button>


      <!-- RIBEIRA -->

      <button
        class="location ribeira"
        type="button"
        data-location="ribeira"
      >

        <div class="location-dot"></div>

        <span class="location-name">
          Ribeira - Cais de Gaia
        </span>

        <span class="location-subtitle">
          nosso spot
        </span>

      </button>


      <!-- AGUDA -->

      <button
        class="location aguda"
        type="button"
        data-location="aguda"
      >

        <div class="location-dot"></div>

        <span class="location-name">
          Praia da Aguda
        </span>

        <span class="location-subtitle">
          um passeio pela praia
        </span>

      </button>

    </div>

    <div class="next-container">
      <a href="parte2.html" class="next-button">
        Continuar →
      </a>
    </div>

  </section>


  <!-- =========================
       CARTA
  ========================= -->

  <section id="letter-screen" class="screen">

    <article class="letter">

      <div id="letter-number" class="letter-number"></div>

      <h2 id="letter-title"></h2>

      <img
        id="letter-photo"
        class="letter-photo"
        alt=""
      >

      <div
        id="letter-content"
        class="letter-content"
      ></div>

      <button
        id="back-button"
        class="back-button"
        type="button"
      >
        ← Voltar ao mapa
      </button>

    </article>

  </section>


  <script>

    /*
      ==========================================
      CONTEÚDO DAS PARADAS
      ==========================================
    */

    const locations = {

      feup: {
        number: "01",
        title: "Faculdade de Engenharia",
        photo: "",
        text: `ONDE TUDO COMEÇOU

É engraçado pensar que tudo começou na faculdade.
Antes de ser o meu amor, você era meu amigo.
O ano era 2019 e eu entrei na faculdade convicta de que não queria fazer amigos. Terminei conhecendo meu melhor amigo.

Éramos só dois jovens perdidos, sem saber exatamente o que queríamos fazer.
Você era confiante.
Lembro-me das aulas de análise matemática em que você assistia jogos de basquete. Eu tinha a certeza de que você ia ir mal na prova. Você tirou 19...
Já ali você mostrava os seus primeiros traços de inteligência e competência. Afinal, você é das pessoas mais inteligentes que conheço.
Isso é certamente algo que admiro e amo em você. Não porque você já tirava boas notas, mas porque você vê o mundo de forma diferente.

A gente só era amigo.

Na época você começou a me zoar me chamando de "mozão". Acho que nem você sabia que de facto isso daria em algo.
A gente saía algumas vezes à noite. Na época ingeríamos álcool e lembro-me da primeira vez em que nós trocamos olhares diferentes: sangria no Piolho.
A gente não bebe mais sangria e eu nunca mais voltei no Piolho.
08/02/2020: Uma festa despretensiosa. Álcool na cabeça — não sabemos a procedência — e demos o nosso primeiro beijo.
Acho que nenhum de nós acreditava que passaria dali.

Eternos soninhos no jardim da FEUP. Risadas e estudos na biblioteca com barras de chocolate. Marmitas na cantina.

Mas isto não é necessariamente sobre a nossa história.

É sobre como você mudou a minha história.`
      },

      ribeira: {
        number: "02",
        title: "Ribeira — Cais de Gaia",
        photo: "",
        text: `
        
A Ribeira foi um dos nossos primeiros spots.

Nos encontrávamos como amigos, conversávamos, até termos um lugar especial que, anos depois, você eternizou com um pedido de casamento.

Mas ali me lembro da época em que fomos nos conhecendo.

Jovens, despretensiosos.

Ali foi quando confessamos nossos primeiros problemas de relação dentro de casa — nos aproximamos.

Ali acho que foi um dos primeiros lugares em que nos desconectamos do mundo e começamos a nos conectar.

Ali te vi vulnerável.

Obrigada por ter pegado todos aqueles comboios tarde da noite.

Pelas longas conversas e trocas nas noites de verão.

Acho que ali começou a nossa intimidade.

Eterno Cais de Gaia.`
      },

      aguda: {
        number: "03",
        title: "Praia da Aguda",
        photo: "",
        text: `GAROTO DE AGUDA

Difícil falar da gente sem falar de Aguda.

Lembro de uma das primeiras cartas que te escrevi. Enderecei para "Garoto de Aguda". KKKK. Acho que nunca te entreguei. Eu tinha vergonha.

Eu usava como desculpa ir caminhar na praia para te encontrar. Muitas vezes funcionou. Você foi de facto me encontrar.

Nas praias caminhamos, conversamos, andamos de bike, passeamos cachorros e crianças — kkkkk, baby Pipa.

Acho que este lugar será eternamente nostálgico para a gente.

Em Aguda conheci seus pais e você me deu uma nova família.
Em Aguda dividimos casa por quase um ano — uma das nossas temporadas mais longas.

Acho que Aguda fez parte do nosso amadurecimento.
Acho que ela conheceu versões nossas.

Em Aguda fui me apaixonando por você e pelo seu jeitinho.

Eternamente garoto de Aguda.`
      }

    };


    /*
      ==========================================
      ELEMENTOS
      ==========================================
    */

    const startButton =
      document.getElementById("start-button");

    const backButton =
      document.getElementById("back-button");

    const mapScreen =
      document.getElementById("map-screen");

    const letterScreen =
      document.getElementById("letter-screen");

    const letterNumber =
      document.getElementById("letter-number");

    const letterTitle =
      document.getElementById("letter-title");

    const letterContent =
      document.getElementById("letter-content");

    const letterPhoto =
      document.getElementById("letter-photo");


    /*
      ==========================================
      NAVEGAÇÃO
      ==========================================
    */

    function hideAllScreens() {

      document
        .querySelectorAll(".screen")
        .forEach(screen => {
          screen.classList.remove("active");
        });

    }


    function showScreen(screen) {

      hideAllScreens();

      screen.classList.add("active");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function showMap() {

      showScreen(mapScreen);

    }


    function openLocation(locationName) {

      const location =
        locations[locationName];

      if (!location) {
        console.error(
          "Parada não encontrada:",
          locationName
        );
        return;
      }

      letterNumber.textContent =
        "PARADA " + location.number;

      letterTitle.textContent =
        location.title;

      letterContent.textContent =
        location.text;


      if (
        location.photo &&
        location.photo.trim() !== ""
      ) {

        letterPhoto.src =
          location.photo;

        letterPhoto.style.display =
          "block";

      } else {

        letterPhoto.removeAttribute("src");

        letterPhoto.style.display =
          "none";

      }


      showScreen(letterScreen);

    }


    /*
      ==========================================
      EVENTOS
      ==========================================
    */

    startButton.addEventListener(
      "click",
      showMap
    );


    backButton.addEventListener(
      "click",
      showMap
    );


    document
      .querySelectorAll(".location")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const locationName =
              button.dataset.location;

            openLocation(locationName);

          }
        );

      });

  </script>

</body>
</html>
